[package]
name = "macshell"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
env_logger = "0.11"
freedesktop-desktop-entry = "0.8.4"
freedesktop-icons = "0.4.0"
# Component crates instead of `iced` itself, which hard-depends on winit.
iced_futures = { version = "0.14", features = ["tokio"] }
iced_layershell = "0.19.1"
iced_runtime = "0.14"
# Without an explicit backend, iced falls back to a renderer that draws nothing.
# `wgpu-bare` is what actually selects the GPU renderer; `wgpu` alone leaves tiny-skia in charge.
iced_renderer = { version = "0.14", features = ["wgpu", "wgpu-bare", "tiny-skia", "wayland", "web-colors"] }
iced_widget = { version = "0.14", features = ["image", "svg"] }
# Decodes icons to recolor them, and enables the codecs for iced's images, which `iced` itself
# would do.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
raw-window-handle = "0.6"
# Same version iced uses, to rasterize SVG icons once.
resvg = "0.45.1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# Already in the tree through zbus; edits the config without losing comments.
toml_edit = "0.25"
# Looks up the weather for its widget.
ureq = { version = "3", features = ["json"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"
# Already in the tree through iced_layershell; talks to NetworkManager, BlueZ and media players.
# Already in the tree; asks a process to quit.
libc = "0.2"
# Already in the tree through zbus, whose name flags are made of it.
enumflags2 = "0.7"
# Already in the tree through iced_futures and zbus.
tokio = { version = "1", features = ["rt", "time"] }
zbus = "5.19"
